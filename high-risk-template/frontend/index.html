<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>高危模版自动上传网站</title>
<style>
  :root {
    --bg: #f5f6fa; --panel: #fff; --line: #e6e8ef; --ink: #1c2033;
    --sub: #6b7080; --muted: #a4a8b8;
    --keep: #16a34a; --keepBg: #ecfdf5;
    --drop: #dc2626; --dropBg: #fef2f2;
    --vlm-e: #f59e0b; --vlm-eBg: #fffbeb;
    --btn: #2b3245; --btnHover: #1c2033;
    --shadow: 0 1px 3px rgba(28,32,51,.06), 0 4px 12px rgba(28,32,51,.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft Yahei", sans-serif;
         background: var(--bg); color: var(--ink); }
  a { color: #2563eb; text-decoration: none; }

  /* 顶栏 */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--panel);
            border-bottom: 1px solid var(--line); padding: 12px 24px;
            display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .topbar .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
                   background: #eef2ff; color: #3b3fce; font-size: 12px; font-weight: 500; }
  .topbar .spacer { flex: 1; }
  .topbar .user { font-size: 13px; color: var(--sub); }
  .topbar .upload-btn { border: 0; background: var(--btn); color: #fff; padding: 8px 14px;
                        border-radius: 8px; cursor: pointer; font-weight: 600; }
  .topbar .upload-btn:hover { background: var(--btnHover); }

  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 53px); }

  /* 侧栏 */
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; }
  .sidebar h3 { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .5px;
                text-transform: uppercase; margin: 0 8px 8px; }
  .run-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
              display: flex; align-items: center; gap: 8px; min-width: 0; }
  .run-item:hover { background: #f5f6fa; }
  .run-item.active { background: #eef2ff; color: #3b3fce; font-weight: 600; }
  .run-item .tag-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                         font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
  .run-item .pill { flex: 0 0 auto; padding: 1px 6px; border-radius: 8px; font-size: 11px; white-space: nowrap; }
  .run-item .pill.done { background: #ecfdf5; color: #16a34a; }
  .run-item .pill.todo { background: #fef2f2; color: #dc2626; }
  .sidebar .empty { color: var(--muted); padding: 12px; font-size: 12px; }
  .sidebar .switch { padding: 12px 8px 0; font-size: 12px; color: var(--sub); }
  .sidebar .switch input { vertical-align: middle; margin-right: 4px; }

  /* 主区 */
  main { padding: 20px 24px 60px; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 16px; min-width: 140px; box-shadow: var(--shadow); }
  .stat .n { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .stat .k { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .stat.keep .n { color: var(--keep); }
  .stat.drop .n { color: var(--drop); }
  .stat.override .n { color: #f59e0b; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
                    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .toolbar button:hover { border-color: #c5cad9; }
  .toolbar button.primary { background: var(--btn); color: #fff; border-color: var(--btn); font-weight: 600; }
  .toolbar button.primary:hover { background: var(--btnHover); }
  .toolbar button.danger { color: #9f1239; border-color: #fecdd3; }
  .toolbar button.danger:hover { background: #fff1f2; border-color: #fda4af; }
  .toolbar button:disabled { opacity: .5; cursor: not-allowed; }
  .toolbar .hint { color: var(--sub); font-size: 12px; margin-left: auto; }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
          transition: transform .1s, border-color .1s; }
  .card:hover { border-color: #c5cad9; }
  .card.decision-keep { border-color: var(--keep); box-shadow: 0 0 0 2px var(--keepBg); }
  .card.decision-drop { border-color: var(--drop); box-shadow: 0 0 0 2px var(--dropBg); opacity: .8; }
  .card.decision-drop .thumb { filter: grayscale(0.7); }

  .thumb-wrap { position: relative; background: #f9f9fc; aspect-ratio: 1/1; overflow: hidden; }
  .thumb { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; background: #f9f9fc; }
  .thumb-wrap .cid { position: absolute; top: 6px; left: 8px; padding: 2px 8px; border-radius: 12px;
                     background: rgba(28,32,51,.75); color: #fff; font-size: 12px; font-weight: 600; }
  .thumb-wrap .cnt { position: absolute; top: 6px; right: 8px; padding: 2px 8px; border-radius: 12px;
                     background: rgba(28,32,51,.75); color: #fff; font-size: 12px; }
  .thumb-wrap .more-btn { position: absolute; bottom: 6px; right: 8px; padding: 2px 8px; border-radius: 12px;
                          background: rgba(255,255,255,.9); color: var(--ink); font-size: 12px;
                          border: 1px solid var(--line); cursor: pointer; }

  .card .body { padding: 12px 14px; min-width: 0; }
  .card .meta { display: flex; justify-content: space-between; gap: 8px; min-width: 0; margin-bottom: 8px; }
  .card .trade { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 font-size: 12px; color: var(--sub); }
  .vlm { padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px;
         line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical;
         -webkit-line-clamp: 2; overflow: hidden; }
  .vlm.electronic { background: var(--vlm-eBg); color: #92400e; }
  .vlm.real { background: #f0fdf4; color: #166534; }
  .vlm.none { background: #f5f6fa; color: var(--sub); }
  .vlm b { font-weight: 600; }

  .actions { display: flex; gap: 6px; }
  .actions button { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 500;
                    color: var(--ink); }
  .actions button:hover { border-color: #c5cad9; }
  .actions button.on-keep { background: var(--keep); border-color: var(--keep); color: #fff; }
  .actions button.on-drop { background: var(--drop); border-color: var(--drop); color: #fff; }
  .actions button.on-auto { background: #eef2ff; border-color: #c7d0ff; color: #3b3fce; }
  .actions button:disabled { opacity: .5; cursor: not-allowed; }

  /* 大图弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100;
           display: none; align-items: center; justify-content: center; padding: 40px; }
  .modal.on { display: flex; }
  .modal .close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 28px;
                  cursor: pointer; }
  .modal img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .modal .thumbs { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
                   display: flex; gap: 8px; }
  .modal .thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px;
                       cursor: pointer; border: 2px solid transparent; opacity: .7; }
  .modal .thumbs img.on { border-color: #fff; opacity: 1; }

  /* 提交结果 */
  .result { margin-top: 20px; padding: 16px; background: var(--panel); border-radius: 12px;
            border: 1px solid var(--line); box-shadow: var(--shadow); }
  .result h3 { margin: 0 0 10px; font-size: 14px; }
  .result .nums { display: flex; gap: 20px; margin-bottom: 10px; }
  .result .nums span { font-size: 13px; }
  .result .nums b { font-size: 18px; margin-right: 4px; }
  .result pre { background: #f5f6fa; padding: 10px; border-radius: 6px; font-size: 12px;
                overflow: auto; max-height: 240px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--btn); color: #fff; padding: 10px 20px; border-radius: 8px;
           z-index: 200; font-size: 13px; opacity: 0; transition: opacity .2s; }
  .toast.on { opacity: 1; }

  .loading { text-align: center; color: var(--muted); padding: 60px; }

  /* 批量上传 */
  .upload-modal { position: fixed; inset: 0; z-index: 120; background: rgba(28,32,51,.45);
                  display: none; align-items: center; justify-content: center; padding: 24px; }
  .upload-modal.on { display: flex; }
  .upload-panel { width: min(680px, 100%); max-height: calc(100vh - 48px); overflow: auto;
                  background: var(--panel); border-radius: 14px; box-shadow: 0 24px 70px rgba(28,32,51,.22); }
  .upload-head { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .upload-head h2 { margin: 0; font-size: 17px; }
  .upload-head button { margin-left: auto; border: 0; background: transparent; color: var(--sub);
                        font-size: 24px; cursor: pointer; }
  .upload-body { padding: 20px; }
  .upload-step { margin-bottom: 18px; }
  .upload-step label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; }
  .upload-step input, .upload-step select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
                                            border-radius: 8px; background: #fff; font: inherit; }
  .upload-step input:focus, .upload-step select:focus { outline: 0; border-color: #818cf8;
                                                        box-shadow: 0 0 0 3px #eef2ff; }
  .upload-help { margin-top: 6px; color: var(--sub); font-size: 12px; }
  .upload-preview { display: none; padding: 12px; border: 1px solid var(--line); border-radius: 9px;
                    background: #f9fafc; margin-bottom: 18px; }
  .upload-preview.on { display: block; }
  .preview-metrics { display: flex; gap: 24px; margin-bottom: 10px; }
  .preview-metrics b { font-size: 20px; margin-right: 4px; }
  .sample-list { margin: 8px 0 0; padding-left: 18px; color: var(--sub); font-size: 12px;
                 overflow-wrap: anywhere; }
  .upload-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px; }
  .upload-actions button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
                           background: #fff; cursor: pointer; font-weight: 600; }
  .upload-actions button.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
  .upload-actions button:disabled { opacity: .45; cursor: not-allowed; }
  .progress-card { max-width: 560px; margin: 40px auto; padding: 28px; background: var(--panel);
                   border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .progress-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
                  background: #2563eb; animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; transform: scale(.78); } }
</style>
</head>
<body>

<header class="topbar">
  <h1>高危模版自动上传网站 <span class="badge" id="badge-run">—</span></h1>
  <div class="spacer"></div>
  <button class="upload-btn" onclick="openUploadModal()">批量上传</button>
  <div class="user" id="user">…</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>Runs</h3>
    <div id="run-list"></div>
    <label class="switch">
      <input type="checkbox" id="show-all"> 显示已入库
    </label>
  </aside>

  <main>
    <div id="content" class="loading">加载中…</div>
  </main>
</div>

<div class="modal" id="modal">
  <span class="close" onclick="closeModal()">×</span>
  <img id="modal-img" src="">
  <div class="thumbs" id="modal-thumbs"></div>
</div>

<div class="toast" id="toast"></div>

<div class="upload-modal" id="upload-modal" onclick="if(event.target===this) closeUploadModal()">
  <div class="upload-panel">
    <div class="upload-head"><h2>批量上传高危模板</h2><button onclick="closeUploadModal()">×</button></div>
    <div class="upload-body">
      <div class="upload-step">
        <label>批次名称</label>
        <input id="upload-short-name" maxlength="24" placeholder="例如 0903金融模板">
        <div class="upload-help">1–24 个字，支持中文、字母、数字、横线和下划线。</div>
      </div>
      <div class="upload-step">
        <label>上传文件</label>
        <input id="upload-file" type="file" accept=".xlsx,.xls,.csv">
        <div class="upload-help">支持 xlsx、xls、csv，最大 50MB；至少包含一列图片 URL。</div>
      </div>
      <div class="upload-step" id="url-col-wrap" style="display:none">
        <label>图片 URL 列</label>
        <select id="upload-url-col"></select>
      </div>
      <div class="upload-preview" id="upload-preview"></div>
      <div class="upload-actions">
        <button onclick="closeUploadModal()">取消</button>
        <button class="primary" id="upload-submit" onclick="createUploadBatch()" disabled>开始自动识别</button>
      </div>
    </div>
  </div>
</div>

<script>
// 同源部署（前端也从后端 / 返出去），相对路径即可，SSO cookie 自然带上
const API_BASE = '';
window.addEventListener('error', e => {
  const c = document.getElementById('content');
  if (c && c.className === 'loading') c.innerHTML = '<div class="loading" style="color:#dc2626">脚本错误：' + (e.message||e) + '</div>';
});
window.addEventListener('unhandledrejection', e => {
  const c = document.getElementById('content');
  if (c && c.className === 'loading') c.innerHTML = '<div class="loading" style="color:#dc2626">加载失败：' + (e.reason && e.reason.message || e.reason) + '</div>';
});
const state = { runs: [], currentTag: null, detail: null, decisions: {}, showAll: false,
                uploadFileRef: null, uploadPreview: null, uploadPoll: null };

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function toast(msg, ms = 2000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms);
}

async function api(path, options = {}) {
  const opt = Object.assign({ credentials: 'include' }, options);
  if (opt.body && !opt.headers && !(opt.body instanceof FormData)) {
    opt.headers = { 'Content-Type': 'application/json' };
  }
  const r = await fetch(API_BASE + path, opt);
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`HTTP ${r.status}: ${t.slice(0, 200)}`);
  }
  return r.json();
}

async function loadWhoami() {
  try {
    const u = await api('/whoami');
    $('#user').textContent = u.username + ' · ' + u.email;
  } catch (e) {
    $('#user').textContent = '未登录';
  }
}

async function loadRuns() {
  const { runs } = await api('/api/runs');
  state.runs = runs;
  renderRunList();
  // 默认选中第一个未入库的；若没有则选第一个（在 showAll 状态）
  const pending = runs.filter(r => !r.submitted);
  const target = pending[0] || (state.showAll ? runs[0] : null);
  if (target) selectRun(target.tag);
  else $('#content').innerHTML = '<div class="loading">🎉 当前没有待复核的 run<br><br><small style="color:#a4a8b8">勾选左下「显示已入库」查看历史</small></div>';
}

function renderRunList() {
  const visible = state.runs.filter(r => state.showAll || !r.submitted);
  if (visible.length === 0) {
    $('#run-list').innerHTML = '<div class="empty">无 run</div>'; return;
  }
  $('#run-list').innerHTML = visible.map(r => `
    <div class="run-item ${r.tag === state.currentTag ? 'active' : ''}" onclick="selectRun('${r.tag}')">
      <span class="tag-name">${r.tag}</span>
      <span class="pill ${r.submitted ? 'done' : 'todo'}">${runStatusText(r)}</span>
    </div>`).join('');
}

function runStatusText(r) {
  if (r.submitted) return '已入库 ' + r.sample_count;
  if (r.vlm_status === 'pending' || r.vlm_status === 'running') return '识别中';
  if (r.vlm_status === 'failed') return '识别失败';
  return '待复核 ' + r.total_reps;
}

async function selectRun(tag) {
  state.currentTag = tag;
  state.decisions = {};
  renderRunList();
  $('#badge-run').textContent = tag;
  const run = state.runs.find(r => r.tag === tag);
  if (run && (run.vlm_status === 'pending' || run.vlm_status === 'running')) {
    renderUploadProgress(tag);
    startUploadPolling(tag);
    return;
  }
  if (run && run.vlm_status === 'failed') {
    $('#content').innerHTML = `<div class="progress-card"><h3>识别失败</h3>
      <p style="color:var(--sub)">该批次自动识别未完成，请重新上传或稍后重试。</p></div>`;
    return;
  }
  $('#content').innerHTML = '<div class="loading">加载 ' + tag + ' …</div>';
  try {
    const d = await api('/api/runs/' + tag);
    state.detail = d;
    // 用后端返回的 human_decision 初始化本地状态
    d.reps.forEach(r => { state.decisions[r.cluster_id] = r.human_decision; });
    renderDetail();
  } catch (e) {
    $('#content').innerHTML = '<div class="loading" style="color:#dc2626">加载失败：' + e.message + '</div>';
  }
}

function renderUploadProgress(tag) {
  $('#content').innerHTML = `<div class="progress-card">
    <h3><span class="progress-dot"></span>正在自动识别</h3>
    <p style="color:var(--sub)">批次 ${escapeHtml(tag)} 已创建，VLM 正在逐张判断。完成后会自动进入人工复核。</p>
    <div id="upload-progress-detail" class="upload-help">正在读取进度…</div>
  </div>`;
}

function startUploadPolling(tag) {
  clearInterval(state.uploadPoll);
  const poll = async () => {
    try {
      const s = await api('/api/uploads/' + encodeURIComponent(tag) + '/status');
      const el = $('#upload-progress-detail');
      if (el) el.textContent = `状态：${s.vlm_status} · 已生成 ${s.total_reps || 0} 条候选`;
      if (s.vlm_status === 'ready') {
        clearInterval(state.uploadPoll); state.uploadPoll = null;
        await loadRuns();
        await selectRun(tag);
      } else if (s.vlm_status === 'failed') {
        clearInterval(state.uploadPoll); state.uploadPoll = null;
        await loadRuns();
        await selectRun(tag);
      }
    } catch (e) { /* 网络闪断时下轮继续 */ }
  };
  poll();
  state.uploadPoll = setInterval(poll, 5000);
}

function effectiveDecision(rep) {
  const d = state.decisions[rep.cluster_id] || 'auto';
  if (d !== 'auto') return d;
  return rep.default_decision;
}

function summary() {
  const d = state.detail;
  const keep = d.reps.filter(r => effectiveDecision(r) === 'keep').length;
  const drop = d.reps.filter(r => effectiveDecision(r) === 'drop').length;
  const override = d.reps.filter(r => (state.decisions[r.cluster_id] || 'auto') !== 'auto').length;
  return { total: d.reps.length, keep, drop, override,
           electronic: d.reps.filter(r => r.vlm_is_electronic).length };
}

function renderDetail() {
  const d = state.detail;
  const s = summary();
  const run = state.runs.find(r => r.tag === d.tag);
  const canDelete = !d.submitted && d.tag.startsWith('upload-') &&
    !['pending', 'running'].includes(run?.vlm_status);
  const submittedBanner = d.submitted
    ? `<div class="stat" style="background:#fef2f2;color:#dc2626;">
         <div class="n">✔ 已入库</div>
         <div class="k">sample_id ${d.sample_count} 条，本页只读</div>
       </div>` : '';
  $('#content').innerHTML = `
    <div class="stats">
      ${submittedBanner}
      <div class="stat"><div class="n">${s.total}</div><div class="k">代表图总数</div></div>
      <div class="stat keep"><div class="n">${s.keep}</div><div class="k">将入库</div></div>
      <div class="stat drop"><div class="n">${s.drop}</div><div class="k">将剔除</div></div>
      <div class="stat"><div class="n" style="color:#f59e0b">${s.electronic}</div><div class="k">VLM 判定电子版</div></div>
      <div class="stat override"><div class="n">${s.override}</div><div class="k">人工覆盖</div></div>
    </div>
    <div class="toolbar">
      <button onclick="setAll('keep')" ${d.submitted?'disabled':''}>全部入库</button>
      <button onclick="setAll('drop')" ${d.submitted?'disabled':''}>全部剔除</button>
      <button onclick="setAll('auto')" ${d.submitted?'disabled':''}>全部跟 VLM</button>
      <button onclick="saveReview()" ${d.submitted?'disabled':''}>💾 保存复核</button>
      <button class="primary" onclick="submitRun()" ${d.submitted?'disabled':''}>🚀 提交入库</button>
      ${canDelete ? '<button class="danger" onclick="deleteCurrentRun()">删除批次</button>' : ''}
      <span class="hint">${d.submitted?'该 run 已入库，无法再次提交':'保存后再点提交入库以确保状态一致'}</span>
    </div>
    <div class="grid">${d.reps.map(renderCard).join('')}</div>
    <div id="result-area"></div>
  `;
}

function renderCard(r) {
  const dec = effectiveDecision(r);
  const humanRaw = state.decisions[r.cluster_id] || 'auto';
  const vlmCls = r.vlm_is_electronic == null ? 'none'
    : r.vlm_is_electronic ? 'electronic' : 'real';
  const vlmText = r.vlm_is_electronic == null ? 'VLM 未判定'
    : (r.vlm_is_electronic ? '📄 电子版' : '📸 实拍') +
      ` <b>[${r.vlm_confidence||'-'}]</b>`;
  const vlmReason = r.vlm_reason ? `<br>${escapeHtml(r.vlm_reason)}` : '';
  const disabled = state.detail.submitted ? 'disabled' : '';
  const rankedCount = (r.ranked_urls||[]).length;
  return `
    <div class="card decision-${dec}" data-cid="${r.cluster_id}">
      <div class="thumb-wrap">
        <img class="thumb" loading="lazy" src="${r.qualification_url}"
             onclick='openModal(${JSON.stringify(r.ranked_urls||[r.qualification_url])}, 0)'
             onerror="this.style.background='#fee';this.alt='加载失败'">
        <span class="cid">#${r.cluster_id}</span>
        <span class="cnt">${r._cluster_size||0} 图</span>
        ${rankedCount>1?`<button class="more-btn" onclick='openModal(${JSON.stringify(r.ranked_urls)}, 0)'>+${rankedCount-1} 同片</button>`:''}
      </div>
      <div class="body">
        <div class="meta">
          <span class="trade">${r.trade_first_name||'—'}${r.trade_second_name?' · '+r.trade_second_name:''}</span>
        </div>
        <div class="vlm ${vlmCls}">${vlmText}${vlmReason}</div>
        <div class="actions">
          <button class="${dec==='keep'?'on-keep':''}" onclick="setDecision('${r.cluster_id}','keep')" ${disabled}>入库</button>
          <button class="${dec==='drop'?'on-drop':''}" onclick="setDecision('${r.cluster_id}','drop')" ${disabled}>剔除</button>
          <button class="${humanRaw==='auto'?'on-auto':''}" onclick="setDecision('${r.cluster_id}','auto')" ${disabled}>跟VLM</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s) { return String(s||'').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }

function setDecision(cid, dec) {
  state.decisions[cid] = dec;
  // 局部重绘
  renderDetail();
}

function setAll(dec) {
  state.detail.reps.forEach(r => state.decisions[r.cluster_id] = dec);
  renderDetail();
}

async function saveReview() {
  const decisions = Object.entries(state.decisions).map(([cluster_id, decision]) => ({cluster_id, decision}));
  try {
    await api(`/api/runs/${state.currentTag}/review`, {
      method: 'POST', body: JSON.stringify({ decisions })
    });
    toast('✅ 复核已保存');
  } catch (e) { toast('保存失败：'+e.message, 4000); }
}

async function submitRun() {
  const s = summary();
  if (!confirm(`即将真跑入库：\n- 将入库 ${s.keep} 张\n- 将剔除 ${s.drop} 张（其中 VLM 电子版 ${s.electronic} 张）\n- 人工覆盖 ${s.override} 项\n\n确定提交？`)) return;
  await saveReview();
  const area = $('#result-area');
  area.innerHTML = '<div class="result"><h3>🚀 入库中，可能需要几十秒…</h3></div>';
  try {
    const r = await api(`/api/runs/${state.currentTag}/submit`, { method: 'POST', body: '{}' });
    area.innerHTML = `
      <div class="result">
        <h3>${r.submitted?'✅ 入库完成':'ℹ️ 无实际入库'}</h3>
        <div class="nums">
          <span><b>${r.ok}</b>成功</span>
          <span><b>${r.duplicated}</b>跨周期重复</span>
          <span><b>${r.failed}</b>失败</span>
          <span>sample_id 范围：<b>${r.sample_ids.length?Math.min(...r.sample_ids)+'~'+Math.max(...r.sample_ids):'—'}</b></span>
        </div>
        <pre>${escapeHtml(r.log_tail||'')}</pre>
      </div>`;
    // 刷新 run 状态
    loadRuns();
  } catch (e) {
    area.innerHTML = `<div class="result" style="color:#dc2626"><h3>❌ 入库失败</h3><pre>${escapeHtml(e.message)}</pre></div>`;
  }
}

async function deleteCurrentRun() {
  const run = state.runs.find(r => r.tag === state.currentTag);
  if (!run || run.submitted || !run.tag.startsWith('upload-')) {
    toast('该批次不支持删除', 3000); return;
  }
  if (run.vlm_status === 'pending' || run.vlm_status === 'running') {
    toast('识别进行中，完成或失败后才能删除', 3000); return;
  }
  if (!confirm(`确认删除批次「${run.tag}」？\n\n仅删除本次上传与复核记录，已入库批次不可删除。`)) return;
  try {
    await api(`/api/runs/${encodeURIComponent(run.tag)}`, { method: 'DELETE' });
    state.currentTag = null; state.detail = null; state.decisions = {};
    toast('批次已删除');
    await loadRuns();
  } catch (e) {
    toast('删除失败：' + e.message, 4000);
  }
}

function openModal(urls, idx) {
  const urlList = typeof urls === 'string' ? [urls] : urls;
  $('#modal').classList.add('on');
  const setSrc = i => {
    $('#modal-img').src = urlList[i];
    $$('#modal-thumbs img').forEach((el,j)=>el.classList.toggle('on', j===i));
  };
  $('#modal-thumbs').innerHTML = urlList.map((u,i)=>`<img src="${u}" onclick="event.stopPropagation();(${setSrc.toString()})(${i})">`).join('');
  setSrc(idx);
}
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

$('#show-all').addEventListener('change', e => {
  state.showAll = e.target.checked; renderRunList();
});

function openUploadModal() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  $('#upload-short-name').value = `${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
  $('#upload-file').value = '';
  $('#url-col-wrap').style.display = 'none';
  $('#upload-preview').classList.remove('on');
  $('#upload-preview').innerHTML = '';
  $('#upload-submit').disabled = true;
  state.uploadFileRef = null;
  state.uploadPreview = null;
  $('#upload-modal').classList.add('on');
}

function closeUploadModal() { $('#upload-modal').classList.remove('on'); }

function renderFilePreview(p) {
  state.uploadPreview = p;
  const urlCol = p.detected_cols && p.detected_cols.url_col;
  const select = $('#upload-url-col');
  select.innerHTML = (p.headers || []).map(h =>
    `<option value="${escapeHtml(h)}" ${h===urlCol?'selected':''}>${escapeHtml(h || '（空列名）')}</option>`
  ).join('');
  $('#url-col-wrap').style.display = 'block';
  const samples = (p.sample_urls || []).slice(0, 3);
  $('#upload-preview').innerHTML = p.error
    ? `<div style="color:var(--drop)">${escapeHtml(p.error)}</div>`
    : `<div class="preview-metrics">
         <span><b>${p.rows_total || 0}</b>总行数</span>
         <span><b style="color:var(--keep)">${p.rows_with_url || 0}</b>有效图片</span>
       </div>
       <div class="upload-help">已识别 URL 列：${escapeHtml(urlCol || '未识别')}</div>
       ${samples.length ? `<ul class="sample-list">${samples.map(u=>`<li>${escapeHtml(u)}</li>`).join('')}</ul>` : ''}`;
  $('#upload-preview').classList.add('on');
  $('#upload-submit').disabled = !urlCol || !(p.rows_with_url > 0);
}

$('#upload-file').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const submit = $('#upload-submit');
  submit.disabled = true;
  $('#upload-preview').classList.add('on');
  $('#upload-preview').innerHTML = '<span class="progress-dot"></span>正在解析文件…';
  try {
    const fd = new FormData(); fd.append('file', file);
    const r = await api('/api/uploads/file', { method: 'POST', body: fd });
    state.uploadFileRef = r.file_ref;
    renderFilePreview(r.preview);
  } catch (err) {
    state.uploadFileRef = null;
    $('#upload-preview').innerHTML = `<div style="color:var(--drop)">解析失败：${escapeHtml(err.message)}</div>`;
  }
});

$('#upload-url-col').addEventListener('change', async e => {
  if (!state.uploadFileRef) return;
  try {
    const p = await api('/api/uploads/preview', {
      method: 'POST', body: JSON.stringify({
        source_type: 'file', file_ref: state.uploadFileRef, url_col: e.target.value
      })
    });
    renderFilePreview(p);
  } catch (err) { toast('预览失败：' + err.message, 4000); }
});

async function createUploadBatch() {
  const shortName = $('#upload-short-name').value.trim();
  const urlCol = $('#upload-url-col').value;
  if (!shortName || !state.uploadFileRef || !urlCol) {
    toast('请填写批次名称并选择文件', 3000); return;
  }
  const btn = $('#upload-submit');
  btn.disabled = true; btn.textContent = '正在创建…';
  try {
    const r = await api('/api/uploads', {
      method: 'POST', body: JSON.stringify({
        short_name: shortName, source_type: 'file',
        file_ref: state.uploadFileRef, url_col: urlCol
      })
    });
    closeUploadModal();
    toast(`已上传 ${r.total_urls} 张图片，开始自动识别`, 3500);
    await loadRuns();
    await selectRun(r.tag);
  } catch (err) {
    toast('创建失败：' + err.message, 5000);
  } finally {
    btn.textContent = '开始自动识别';
    btn.disabled = false;
  }
}

// init
loadWhoami();
loadRuns();
</script>
</body>
</html>
